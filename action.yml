name: BranchGuard
description: Check whether two Git refs can merge without conflicts.
author: wonderly321

branding:
  icon: git-branch
  color: blue

inputs:
  base:
    description: Base ref to merge into.
    required: false
    default: origin/main
  head:
    description: Head ref to check.
    required: false
    default: HEAD
  json:
    description: Print BranchGuard JSON output. Prefer format for new workflows.
    required: false
    default: "true"
  format:
    description: Output format. Supported values are json, markdown, and text.
    required: false
    default: json
  fail-on-conflict:
    description: Fail the workflow when BranchGuard detects conflicts.
    required: false
    default: "true"
  summary:
    description: Write the BranchGuard report to the GitHub Actions step summary.
    required: false
    default: "true"
  comment:
    description: Create or update a pull request comment with the BranchGuard report.
    required: false
    default: "false"
  comment-header:
    description: Hidden marker used to find and update an existing BranchGuard pull request comment.
    required: false
    default: "<!-- branchguard-report -->"
  github-token:
    description: GitHub token used when comment is true.
    required: false
  working-directory:
    description: Repository directory to run BranchGuard in.
    required: false
    default: .

outputs:
  exit-code:
    description: BranchGuard exit code. 0 is clean, 1 is error, 2 is conflict.
  conflict:
    description: Whether BranchGuard detected conflicts.
  report:
    description: BranchGuard stdout report.
  summary-written:
    description: Whether BranchGuard wrote to the GitHub Actions step summary.
  comment-written:
    description: Whether BranchGuard created or updated a pull request comment.
  comment-url:
    description: URL of the pull request comment when available.

runs:
  using: node20
  main: bin/github-action.mjs
