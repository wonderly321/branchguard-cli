name: BranchGuard
description: Check whether two Git refs can merge without conflicts.
author: wonderly321

branding:
  icon: git-branch
  color: blue

inputs:
  mode:
    description: BranchGuard command mode. Supported values are check and matrix.
    required: false
    default: check
  base:
    description: Base ref to merge into.
    required: false
    default: origin/main
  head:
    description: Head ref to check.
    required: false
    default: HEAD
  limit:
    description: Maximum local branches to include when mode is matrix.
    required: false
    default: "20"
  json:
    description: Print BranchGuard JSON output. Prefer format for new workflows.
    required: false
    default: "true"
  format:
    description: Output format. Supported values are json, markdown, html, and text.
    required: false
    default: json
  fail-on-conflict:
    description: Fail the workflow when BranchGuard detects conflicts.
    required: false
    default: "true"
  fail-on-risk:
    description: Failure policy for detected conflicts. Supported values are any, high, and never. Overrides fail-on-conflict when set.
    required: false
  summary:
    description: Write the BranchGuard report to the GitHub Actions step summary.
    required: false
    default: "true"
  summary-title:
    description: Heading used for the GitHub Actions step summary.
    required: false
    default: BranchGuard CI Summary
  comment:
    description: Create or update a pull request comment with the BranchGuard report.
    required: false
    default: "false"
  comment-header:
    description: Hidden marker used to find and update an existing BranchGuard pull request comment.
    required: false
    default: "<!-- branchguard-report -->"
  github-token:
    description: GitHub token used when comment is true.
    required: false
  output:
    description: Optional path for writing the BranchGuard report file.
    required: false
  webhook-url:
    description: Optional team webhook URL for BranchGuard notifications.
    required: false
  webhook-provider:
    description: Webhook payload format. Supported values are generic, feishu, and dingtalk.
    required: false
    default: generic
  webhook-on:
    description: When to send webhook notifications. Supported values are conflict, high, always, and never.
    required: false
    default: conflict
  webhook-fail-on-error:
    description: Fail the workflow when webhook delivery fails.
    required: false
    default: "false"
  working-directory:
    description: Repository directory to run BranchGuard in.
    required: false
    default: .

outputs:
  mode:
    description: Effective BranchGuard command mode.
  exit-code:
    description: BranchGuard exit code. 0 is clean, 1 is error, 2 is conflict.
  conflict:
    description: Whether BranchGuard detected conflicts.
  risk-level:
    description: BranchGuard risk level. LOW, MEDIUM, or HIGH.
  failure-policy:
    description: Effective workflow failure policy.
  report:
    description: BranchGuard stdout report.
  report-path:
    description: Report file path when the output input is provided.
  summary-written:
    description: Whether BranchGuard wrote to the GitHub Actions step summary.
  comment-written:
    description: Whether BranchGuard created or updated a pull request comment.
  comment-url:
    description: URL of the pull request comment when available.
  webhook-sent:
    description: Whether BranchGuard sent a team webhook notification.
  webhook-error:
    description: Webhook delivery error when available.

runs:
  using: node20
  main: bin/github-action.mjs
