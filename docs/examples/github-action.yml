name: BranchGuard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge conflicts
        uses: wonderly321/branchguard-cli@main
        with:
          base: origin/main
          head: HEAD
          format: markdown
          fail-on-risk: high
          comment: "true"
          github-token: ${{ github.token }}
