name: BranchGuard

on:
  pull_request:
    branches:
      - main

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge conflicts
        uses: wonderly321/branchguard-cli@main
        with:
          base: origin/main
          head: HEAD
          json: "true"
