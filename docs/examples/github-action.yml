name: BranchGuard

on:
  pull_request:
    branches:
      - main

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install BranchGuard
        run: npm install --global @sonori/branchguard-cli

      - name: Check merge conflicts
        run: branchguard check origin/main HEAD --json
